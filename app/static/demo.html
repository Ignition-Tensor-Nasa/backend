<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSI-Lens Explorer</title>
<style>
:root {
  --page:#f4f3ef; --surface:#fcfcfb; --ink:#0b0b0b; --muted:#52514e; --line:#e1e0db; --accent:#2a78d6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --seq-lo:#a9cdf3; --seq-hi:#0a3a85; --warn-bg:#fff4d6;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page:#121211; --surface:#1a1a19; --ink:#f0efec; --muted:#c3c2b7; --line:#34332f; --accent:#3987e5;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c;
  --seq-lo:#2b4f86; --seq-hi:#9cc7f7; --warn-bg:#3a3217; } }
:root[data-theme="dark"] {
  --page:#121211; --surface:#1a1a19; --ink:#f0efec; --muted:#c3c2b7; --line:#34332f; --accent:#3987e5;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c;
  --seq-lo:#2b4f86; --seq-hi:#9cc7f7; --warn-bg:#3a3217; }
* { box-sizing:border-box; }
body { margin:0; background:var(--page); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
header { padding:20px 16px 8px; max-width:1280px; margin:0 auto; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
header h1 { margin:0; font-size:22px; } header a { color:var(--accent); cursor:pointer; text-decoration:none; font-size:14px; }
main { max-width:1280px; margin:0 auto; padding:8px 16px 48px; }
.muted { color:var(--muted); } .small { font-size:13px; }
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; margin-top:12px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; text-align:left; font:inherit;
  color:inherit; cursor:pointer; display:block; width:100%; }
.card:hover, .card:focus-visible { border-color:var(--accent); outline:none; box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent); }
.card h3 { margin:0 0 4px; font-size:17px; } .card .n { float:right; font-weight:700; font-size:22px; color:var(--accent); }
.card p { margin:6px 0 0; }
.layout { display:grid; grid-template-columns:280px 1fr; gap:16px; margin-top:12px; }
@media (max-width:900px) { .layout { grid-template-columns:1fr; } }
.panel { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; }
.panel h2 { margin:0 0 8px; font-size:15px; }
label { display:block; font-size:13px; color:var(--muted); margin:10px 0 3px; }
select, input[type=number], input[type=text] { width:100%; font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:8px;
  background:var(--page); color:var(--ink); }
.row { display:flex; gap:8px; } .row > * { flex:1; min-width:0; }
.chk { display:flex; align-items:center; gap:6px; margin:4px 0; color:var(--ink); font-size:14px; }
button.primary { font:inherit; padding:7px 12px; border-radius:8px; border:0; background:var(--accent); color:#fff; cursor:pointer; margin-top:8px; }
button.primary:focus-visible { outline:3px solid var(--ink); outline-offset:2px; }
#chart { height:540px; } .badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; border:1px solid var(--line); }
.warn { background:var(--warn-bg); border-radius:8px; padding:6px 10px; margin-top:8px; font-size:13px; }
.detail h3 { margin:0 0 6px; font-size:16px; } .detail dt { font-weight:600; margin-top:8px; } .detail dd { margin:2px 0 0; }
.tags span { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:0 8px; margin-right:4px; font-size:12px; }
.hint { text-align:center; padding:40px 8px; }
</style>
</head>
<body>
<header><h1>PSI-Lens Explorer</h1><span class="muted small">NASA combustion data · real measurements, labelled sources</span>
<a id="home" hidden>← all projects</a></header>
<main id="main"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.2/plotly.min.js"></script>
<script>
const API = "/api/v1";
const $ = (sel, root = document) => root.querySelector(sel);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const state = { project: null, last: null };
const IGNITION_KINDS = ["sensors", "detectors"];   // datasets that have a logged start event

async function api(path, body) {
  const response = await fetch(API + path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail || response.status));
  return data;
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mix = (a, b, t) => {  // interpolate two #rrggbb colours
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)), x = p(a), y = p(b);
  return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, "0")).join("");
};

async function showProjects() {
  state.project = null; $("#home").hidden = true;
  const projects = await api("/projects");
  $("#main").innerHTML = `<p class="muted">Choose a mission. Each one opens charts that compare many real runs at once.</p>
    <div class="cards">${projects.map(p => `<button class="card" data-id="${esc(p.project_id)}">
      <span class="n">${p.case_count}</span><h3>${esc(p.title)}</h3>
      <div class="muted small">${esc(p.mission)} · ${esc(p.source)}</div>
      <p>${esc(p.summary)}</p><p class="muted small">Measured: ${esc(p.measures)}</p></button>`).join("")}</div>`;
  document.querySelectorAll(".card").forEach(card => card.addEventListener("click", () => openProject(card.dataset.id)));
}

async function openProject(id) {
  const project = await api("/projects/" + encodeURIComponent(id));
  state.project = project; $("#home").hidden = false;
  const views = project.views;
  const fuels = project.filters.fuel;
  $("#main").innerHTML = `
    <h2 style="margin:8px 0 2px">${esc(project.title)}</h2>
    <p class="muted" style="margin:0;max-width:90ch">${esc(project.summary)}</p>
    <div class="layout"><div>
      <div class="panel"><h2>What to plot</h2>
        <label for="kind">Dataset</label><select id="kind">${views.map(v => `<option value="${esc(v.kind)}">${esc(v.label)} (${v.cases})</option>`).join("")}</select>
        <label for="channel">Channel</label><select id="channel"></select>
        <label for="align">Time zero</label><select id="align"><option value="ignition">logged start event</option><option value="start">start of recording</option></select>
        <label for="color">Colour curves by</label><select id="color"><option value="o2_pct">oxygen (%)</option><option value="pressure_kpa">pressure (kPa)</option><option value="fuel">fuel</option></select>
        <label for="max">Curves shown (max)</label><input id="max" type="number" min="1" max="100" value="30">
      </div>
      <div class="panel" style="margin-top:12px"><h2>Which runs</h2>
        ${fuels.length ? `<div id="fuels">${fuels.map(f => `<label class="chk"><input type="checkbox" value="${esc(f)}" checked> ${esc(f)}</label>`).join("")}</div>` : `<p class="muted small">This project has no fuel metadata.</p>`}
        ${rangeInputs("o2", "Oxygen (%)", project.filters.o2_pct)}${rangeInputs("p", "Pressure (kPa)", project.filters.pressure_kpa)}
        <button class="primary" id="apply">Update chart</button>
      </div>
      <div class="panel" style="margin-top:12px"><h2>Describe it</h2>
        <input id="ask" type="text" placeholder="e.g. butane above 200 kPa and over 39% oxygen">
        <button class="primary" id="askgo">Set filters</button><div id="askout" class="small"></div></div>
    </div><div>
      <div class="panel"><div id="status" class="small muted"></div><div id="chart"></div><div id="note" class="small muted"></div></div>
      <div class="panel detail" id="detail" style="margin-top:12px"><p class="muted hint">Click a curve to read about that run.</p></div>
    </div></div>`;
  const fillChannels = () => {
    const view = views.find(v => v.kind === $("#kind").value);
    $("#channel").innerHTML = view.channels.map(c => `<option value="${esc(c.key)}">${esc(c.label)}${c.unit ? " [" + esc(c.unit) + "]" : ""}</option>`).join("");
    const preferred = view.default_y.find(k => view.channels.some(c => c.key === k)) || view.channels[0].key;
    $("#channel").value = preferred;
    const canAlign = IGNITION_KINDS.includes(view.kind);
    $("#align").disabled = !canAlign; if (!canAlign) $("#align").value = "start";
  };
  fillChannels();
  $("#kind").addEventListener("change", () => { fillChannels(); draw(); });
  ["channel", "align", "color", "max"].forEach(i => $("#" + i).addEventListener("change", draw));
  $("#apply").addEventListener("click", draw); $("#askgo").addEventListener("click", ask);
  $("#ask").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
  if (!views.length) { $("#status").textContent = "This project has no datasets."; return; }
  draw();
}
function rangeInputs(id, label, bounds) {
  if (!bounds) return `<label>${label}</label><p class="muted small">no known values</p>`;
  return `<label>${label}</label><div class="row"><input id="${id}min" type="number" step="any" placeholder="min ${bounds.min.toFixed(1)}" aria-label="${label} min">
    <input id="${id}max" type="number" step="any" placeholder="max ${bounds.max.toFixed(1)}" aria-label="${label} max"></div>`;
}
function currentFilters() {
  const f = {}, boxes = [...document.querySelectorAll("#fuels input")];
  const on = boxes.filter(b => b.checked).map(b => b.value);
  if (boxes.length && on.length < boxes.length) f.fuel = on;
  const range = (a, b) => { const r = {}; if ($(a)?.value !== "" && $(a)) r.min = +$(a).value; if ($(b)?.value !== "" && $(b)) r.max = +$(b).value; return Object.keys(r).length ? r : null; };
  const o2 = range("#o2min", "#o2max"), p = range("#pmin", "#pmax");
  if (o2) f.o2_pct = o2; if (p) f.pressure_kpa = p;
  return f;
}
async function ask() {
  const text = $("#ask").value.trim(); if (!text) return;
  $("#askout").innerHTML = "<span class='muted'>thinking…</span>";
  try {
    const r = await api("/filters/interpret", { text, current_filters: currentFilters() });
    const f = r.filters;
    document.querySelectorAll("#fuels input").forEach(b => b.checked = !f.fuel || f.fuel.includes(b.value));
    const set = (id, v) => { if ($(id)) $(id).value = v ?? ""; };
    set("#o2min", f.o2_pct?.min); set("#o2max", f.o2_pct?.max); set("#pmin", f.pressure_kpa?.min); set("#pmax", f.pressure_kpa?.max);
    $("#askout").innerHTML = `<span class="badge">${r.mode === "demo" ? "demo mode: rehearsed answer" : "live AI"}</span>` +
      r.warnings.map(w => `<div class="warn">${esc(w)}</div>`).join("");
    draw();
  } catch (e) { $("#askout").innerHTML = `<div class="warn">${esc(e.message)}</div>`; }
}

async function draw() {
  const kind = $("#kind").value, channel = $("#channel").value, align = $("#align").value, colorBy = $("#color").value;
  $("#status").textContent = "loading…";
  let data;
  try {
    data = await api(`/projects/${encodeURIComponent(state.project.project_id)}/overlay`,
      { kind, channel, filters: currentFilters(), align, max_series: +$("#max").value || 30, max_points: 1200 });
  } catch (e) { $("#status").innerHTML = `<span class="warn">${esc(e.message)}</span>`; Plotly.purge("chart"); return; }
  state.last = data;
  if (!data.series.length) { Plotly.purge("chart"); $("#status").textContent = "No runs match."; $("#note").textContent = data.note; return; }
  $("#status").textContent = `${data.series.length} of ${data.matched} matching runs shown`;
  $("#note").textContent = data.note;
  const values = data.series.map(s => s[colorBy]).filter(v => v != null);
  const lo = Math.min(...values), hi = Math.max(...values);
  const fuels = [...new Set(data.series.map(s => s.fuel))], palette = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6"].map(css);
  const colorOf = s => colorBy === "fuel" ? palette[fuels.indexOf(s.fuel) % palette.length]
    : s[colorBy] == null ? css("--muted") : mix(css("--seq-lo"), css("--seq-hi"), hi === lo ? .5 : (s[colorBy] - lo) / (hi - lo));
  const seen = new Set(), traces = data.series.map(s => {
    const showLegend = colorBy === "fuel" && !seen.has(s.fuel); seen.add(s.fuel);
    return { x: s.points.map(p => p[0]), y: s.points.map(p => p[1]), type: "scatter", mode: "lines", connectgaps: false,
      line: { width: 1.6, color: colorOf(s) }, opacity: .9, name: colorBy === "fuel" ? (s.fuel ?? "unknown") : s.case_id,
      legendgroup: s.fuel, showlegend: showLegend, meta: s.case_id,
      hovertemplate: `<b>${esc(s.case_id)}</b><br>${esc(s.title)}<br>%{x:.1f} ${data.x.unit ?? ""}, %{y:.4g} ${data.channel.unit ?? ""}<extra></extra>` };
  });
  if (colorBy !== "fuel" && hi !== lo) traces.push({ x: [null], y: [null], type: "scatter", mode: "markers", showlegend: false, hoverinfo: "skip",
    marker: { colorscale: [[0, css("--seq-lo")], [1, css("--seq-hi")]], cmin: lo, cmax: hi, color: [lo], showscale: true,
      colorbar: { title: { text: colorBy === "o2_pct" ? "O₂ %" : "kPa", font: { color: css("--muted") } }, tickfont: { color: css("--muted") }, len: .8 } } });
  const grid = css("--line"), ink = css("--muted");
  Plotly.react("chart", traces, {
    paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)", font: { color: css("--ink"), size: 13 },
    margin: { l: 70, r: 20, t: 10, b: 55 }, hovermode: "closest", hoverdistance: 20,
    xaxis: { title: { text: `${data.x.label}${data.x.unit ? " [" + data.x.unit + "]" : ""}` }, gridcolor: grid, zerolinecolor: ink, tickfont: { color: ink } },
    yaxis: { title: { text: `${data.channel.label}${data.channel.unit ? " [" + data.channel.unit + "]" : ""}` }, gridcolor: grid, zeroline: false, tickfont: { color: ink } },
    legend: { orientation: "h", y: 1.08 },
  }, { responsive: true, displaylogo: false });
  $("#chart").on?.("plotly_click", ev => { const id = ev.points?.[0]?.data?.meta; if (id) showCase(id); });
}

async function showCase(id) {
  const c = await api("/cases/" + encodeURIComponent(id));
  const rc = c.research_context;
  $("#detail").innerHTML = `<h3>${esc(c.title)}</h3>
    ${c.explanation ? `<p>${esc(c.explanation.text)} <span class="badge">${esc(c.explanation.origin)}</span></p>` : ""}
    <dl><dt>Conditions</dt><dd>${esc(c.fuel ?? "fuel unknown")} · ${c.o2_pct == null ? "O₂ unknown" : c.o2_pct.toFixed(1) + "% O₂"} · ${c.pressure_kpa == null ? "pressure unknown" : c.pressure_kpa.toFixed(0) + " kPa"}${c.z_st == null ? "" : " · Zst " + c.z_st.toFixed(3)}</dd>
    <dt>Note</dt><dd class="small">${esc(c.note)}</dd>
    ${c.events.length ? `<dt>Logged events</dt><dd class="small">${c.events.map(e => `${esc(e.label)} at ${e.time_s.toFixed(0)} s`).join(" · ")}</dd>` : ""}
    <dt>Research context</dt><dd class="tags">${rc.tags.map(t => `<span>${esc(t)}</span>`).join("")}<span class="muted small">${esc(rc.disclaimer)}</span></dd>
    <dt>Source</dt><dd class="small">${esc(c.source_label)}</dd>
    <dt>Download</dt><dd class="small">${c.datasets.map(d => `<a href="${API}/datasets/${encodeURIComponent(d.dataset_id)}/csv" style="color:var(--accent)">${esc(d.label)} (CSV)</a>`).join(" · ")}</dd></dl>`;
  $("#detail").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

$("#home").addEventListener("click", showProjects);
showProjects().catch(e => { $("#main").innerHTML = `<p class="warn">Cannot reach the API: ${esc(e.message)}. Has the data been prepared (python3 -m data_prep.prepare)?</p>`; });
</script>
</body>
</html>
